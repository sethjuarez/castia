[package]
name = "castia"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
serde = []

[dependencies]
async-trait = "0.1"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
sha2 = "0.10"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
