name: foundry-agent-starter-kit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/foundry-agent-starter-kit.yml"
      - "plugins/foundry-agent-starter-kit/**"
  pull_request:
    paths:
      - ".github/workflows/foundry-agent-starter-kit.yml"
      - "plugins/foundry-agent-starter-kit/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Foundry Agent Starter Kit tooling
        working-directory: plugins/foundry-agent-starter-kit
        run: npm ci

      - name: Build committed playground assets
        working-directory: plugins/foundry-agent-starter-kit
        run: npm run build

      - name: Run Foundry Agent Playground tests
        working-directory: plugins/foundry-agent-starter-kit
        run: npm test

      - name: Check Foundry Agent Playground extension syntax
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find plugins/foundry-agent-starter-kit/com.github.copilot/extensions/foundry-agent-playground -name '*.mjs' -print0)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            node --check "$file"
          done
          node --check plugins/foundry-agent-starter-kit/com.github.copilot/extensions/foundry-agent-playground/renderer/dist/playground-client.js

      - name: Verify committed playground assets are fresh
        run: git diff --exit-code -- plugins/foundry-agent-starter-kit/com.github.copilot/extensions/foundry-agent-playground/renderer/dist/playground-client.js
