[project]
name = "prompty-agent"
version = "0.1.0"
description = "A Castia example agent using the optional Prompty runtime harness."
requires-python = ">=3.11"
dependencies = [
    "castia[optimize,prompty]==0.7.7",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.uv]
package = false
