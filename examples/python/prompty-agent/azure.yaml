# Deployment intent only. No infrastructure is created by this scaffold.
name: prompty-agent
services:
  prompty-agent:
    project: .
    host: azure.ai.agent
    language: python
    kind: hosted
    name: prompty-agent
    description: A Castia agent using the optional Prompty runtime harness.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      PROMPTY_TOOLBOX_ALLOWED_TOOLS: ${PROMPTY_TOOLBOX_ALLOWED_TOOLS}
      AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: ${AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED}
      FOUNDRY_PROJECT_RESOURCE_ID: ${AZURE_AI_PROJECT_ID}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
