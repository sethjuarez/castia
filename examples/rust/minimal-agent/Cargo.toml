[package]
name = "castia-rust-minimal-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
castia = { path = "../../../packages/rust" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }
